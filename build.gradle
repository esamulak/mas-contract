plugins {
    id 'org.openapi.generator' version '7.25.0' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'org.openapi.generator'
    apply plugin: 'maven-publish'

    group = 'pl.es8it.mas.contract'
    version = '1.0.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        api 'org.springframework:spring-web:7.0.2'
        api 'com.fasterxml.jackson.core:jackson-annotations:2.20'
        api 'jakarta.annotation:jakarta.annotation-api:3.0.0'
        api 'jakarta.validation:jakarta.validation-api:3.1.1'
    }

    openApiGenerate {
        inputSpec = layout.projectDirectory.file('contract/openapi.yaml').asFile.path
        outputDir = layout.buildDirectory.dir('generated/openapi').get().asFile.path
        generatorName = 'spring'
        generateApiDocumentation = false
        generateModelDocumentation = false
        generateApiTests = false
        generateModelTests = false
        globalProperties = [
                apis  : '',
                models: ''
        ]
        configOptions = [
                interfaceOnly             : 'true',
                useSpringBoot4            : 'true',
                skipDefaultInterface      : 'true',
                openApiNullable           : 'false',
                useBeanValidation         : 'false',
                useSpringBuiltInValidation: 'true',
                documentationProvider     : 'none',
                annotationLibrary         : 'none'
        ]
    }

    sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/openapi/src/main/java'))

    tasks.named('compileJava') {
        dependsOn tasks.named('openApiGenerate')
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
    }
}
