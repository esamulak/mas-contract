openapi: 3.1.0

info:
  title: MAS Vehicle API
  version: 1.0.0

paths:
  /vehicle/ignition:
    get:
      operationId: fetchIgnitionStatus
      summary: Fetch ignition status from the vehicle

      responses:
        '200':
          description: Ignition data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleIgnitionDTO'

components:
  schemas:
    VehicleIgnitionDTO:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - 'ON'
            - 'OFF'
