openapi: 3.1.0

info:
  title: MAS Diagnostics API
  version: 1.0.0

paths:
  /low-beam-light:
    get:
      operationId: getLowBeamLight
      summary: Get low-beam light state

      responses:
        '200':
          description: Low-beam light
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LowBeamLightDTO'

    post:
      operationId: updateLowBeamLight
      summary: Update low-beam light state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LowBeamLightDTO'
            example:
              state: 'ON'
      responses:
        '200':
          description: OK

components:
  schemas:
    LowBeamLightDTO:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - 'ON'
            - 'OFF'