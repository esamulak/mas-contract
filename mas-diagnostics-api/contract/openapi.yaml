openapi: 3.1.0

info:
  title: MAS Diagnostics API
  version: 1.0.0

paths:
  /ignition:
    get:
      operationId: getIgnition
      summary: Get ignition status

      responses:
        '200':
          description: Ignition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgnitionDTO'

components:
  schemas:
    IgnitionDTO:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - 'ON'
            - 'OFF'
