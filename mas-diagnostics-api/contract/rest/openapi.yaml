openapi: 3.0.3

info:
  title: MAS Diagnostics API
  version: 1.0.0

paths:
  /diagnostics/ignition:
    get:
      operationId: getIgnition
      summary: Get ignition status

      responses:
        '200':
          description: Ignition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgnitionDTO'

components:
  schemas:
    IgnitionDTO:
      $ref: './schema/IgnitionDTO.yaml'
    IgnitionStatusDTO:
      $ref: './schema/IgnitionStatusDTO.yaml'
