openapi: 3.1.0

info:
  title: MAS Common API
  version: 1.0.0

paths: {}

components:
  schemas:
    ErrorResponseDTO:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          pattern: '^MASERR-\d{4}[BT]$'
        errorMessage:
          type: string
          minLength: 1
          maxLength: 255